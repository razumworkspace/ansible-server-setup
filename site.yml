---
- name: Базовая настройка сервера
  hosts: servers
  become: yes
  vars_files:
    - secrets.yml
  tasks:
    - name: Обновление кэша apt
      apt:
        update_cache: yes

    - name: Установка базовых утилит
      apt:
        name:
          - htop
          - curl
          - wget
          - net-tools
        state: present
    - name: Установка nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
    - name: Установка ufw
      apt:
        name: ufw
        state: present
        update_cache: yes
    - name: Разрешаем SSH в ufw
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Разрешаем HTTP в ufw
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Включаем ufw
      ufw:
        state: enabled
        policy: deny
